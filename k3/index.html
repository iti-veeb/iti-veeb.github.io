<script src="../msal-browser.min.js"></script>
<script>/* ITI arendusversiooni uks. Avalikus hoidlas on igal lehe aadressil ainult see uks; lehe sisu on privaatses hoidlas ja
   tuleb läbi vaaturi (Apps Script, sisemine\rakendused\vaatur) alles pärast sisselogimist Microsofti kontoga.
   Uks logib sisse sama registreeringuga mis kursuse rakendus (tõendid vahekaardi mälus), annab Microsofti tõendi vaaturile,
   saab vastu vaaturi sessiooni ja küsib sellega praeguse aadressi lehe. Leht kirjutatakse samasse aknasse samal aadressil:
   kursuse rakendus leiab olemasoleva sisselogimise ja uut ei küsi. */
(function () {
  "use strict";
  var CLIENT = "a2c49306-22a2-4de1-98a5-28815814873d", TENANT = "df3b3606-d59f-4297-88f1-f5e4bf7c1532";
  // Uks töötab ainult ehituses kirja pandud aadressil; mujal majutatud koopia sisse logida ei saa.
  var ALUSED = ["https://iti-veeb.github.io/"];
  var ALUS = ALUSED.filter(function (a) { return location.href.indexOf(a) === 0; })[0] || "";
  var AUTH = ALUS ? ALUS + "auth.html" : "";
  var SESS = "iti_uks_sess";
  var VAATURI_MUSTER = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/;
  var SCOPES_SISSE = ["User.Read", "GroupMember.Read.All"];
  var SCOPES = SCOPES_SISSE.concat(["User.ReadBasic.All", "Sites.Selected"]);
  var SCOPES_VANA = SCOPES_SISSE.concat(["Sites.ReadWrite.All"]);   // üleminek, vt rak_app.js
  var kast = document.getElementById("uksKast"), nupp = document.getElementById("avaSisse"), teadeEl = document.getElementById("uksTeade");
  if (!kast || !nupp || !teadeEl) return;
  function teade(t, viga) { teadeEl.textContent = t || ""; teadeEl.hidden = !t; teadeEl.classList.toggle("viga", !!viga); }
  function laeb(jah) { kast.classList.toggle("laeb", !!jah); nupp.disabled = !!jah; }
  // Kui lehte ei saa kohe laadida (sessioon puudub või tekkis viga), tuuakse ette uks koos teatega.
  function uksEtte() { document.documentElement.classList.remove("laeb"); }
  if (window.top !== window.self) { nupp.disabled = true; teade("Leht ei tööta teise lehe raami sees.", true); return; }

  function sess() { try { var s = JSON.parse(sessionStorage.getItem(SESS) || "null"); if (s && s.s && s.exp > Date.now() + 30000) return s; } catch (e) {} return null; }
  function unusta() { try { sessionStorage.removeItem(SESS); } catch (e) {} }
  // Praeguse aadressi leht hoidlas (nt "k5/index.html").
  function tee() { var p = location.href.split("#")[0].split("?")[0].slice(ALUS.length); if (!p || /\/$/.test(p)) p += "index.html"; return p; }

  var vaatur = null;
  async function vaaturiAadress() {
    if (vaatur) return vaatur;
    var r = await fetch(ALUS + "vaatur.json", { cache: "no-store", credentials: "omit" });
    var j = await r.json(), u = String((j && j.vaatur) || "").trim();
    if (!VAATURI_MUSTER.test(u)) throw new Error("Vaaturi aadress on seadistamata (fail vaatur.json).");
    vaatur = u; return u;
  }
  // Päring vaaturile: POST ilma erilise sisutüübita (eelpäringut ei tehta); sessioon on kehas, mitte aadressis.
  async function api(keha) {
    var r = await fetch(await vaaturiAadress(), { method: "POST", body: JSON.stringify(keha), headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow", credentials: "omit", referrerPolicy: "no-referrer" });
    var t = await r.text();
    try { return JSON.parse(t); } catch (e) { throw new Error("Vaatur vastas ootamatult."); }
  }
  // Laadib praeguse aadressi lehe ja kirjutab selle aknasse. Tagastab false, kui sessiooni ei ole või see on aegunud.
  async function ava() {
    var s = sess(); if (!s) return false;
    laeb(true); teade("Laen lehte …");
    var v = await api({ a: "leht", s: s.s, p: tee() });
    if (v && v.ok && typeof v.html === "string") { document.open(); document.write(v.html); document.close(); return true; }
    if (v && v.kood === 401) { unusta(); laeb(false); teade(""); return false; }
    laeb(false); uksEtte();
    if (v && v.kood === 404) { teade("Seda lehte ei ole. Avaleht: " + ALUS, true); return true; }
    throw new Error((v && v.viga) || "Lehte ei saanud laadida.");
  }

  var app = null, valmis = null, konto = null, vanadOigused = false;
  function msalValmis() {
    if (valmis) return valmis;
    if (!window.msal) return Promise.reject(new Error("Sisselogimise teeki ei saanud laadida."));
    app = new msal.PublicClientApplication({ auth: { clientId: CLIENT, authority: "https://login.microsoftonline.com/" + TENANT, redirectUri: AUTH || ALUSED[0] + "auth.html" }, cache: { cacheLocation: "sessionStorage" } });
    valmis = app.initialize ? app.initialize() : Promise.resolve();
    return valmis;
  }
  async function vaikne(scopes) { return (await app.acquireTokenSilent({ scopes: scopes, account: konto })).accessToken; }
  async function toend() {
    if (!vanadOigused) { try { return await vaikne(SCOPES); } catch (e) {} }
    try { var t = await vaikne(SCOPES_VANA); vanadOigused = true; return t; } catch (e) {}
    return await vaikne(SCOPES_SISSE);
  }
  // Microsofti tõend vaaturile -> vaaturi sessioon -> leht.
  async function vaaturisse() {
    laeb(true); teade("Kontrollin ligipääsu …");
    var v = await api({ a: "login", t: await toend() });
    if (!v || !v.ok) { laeb(false); uksEtte(); teade((v && v.viga) || "Sisselogimine ebaõnnestus.", true); return; }
    try { sessionStorage.setItem(SESS, JSON.stringify({ s: v.s, exp: v.exp, kes: v.kes || "" })); } catch (e) {}
    if (!(await ava())) { laeb(false); uksEtte(); teade("Lehte ei saanud laadida.", true); }
  }
  function viga(err) {
    laeb(false); uksEtte();
    if (err && /user_cancelled|popup_window/i.test(err.errorCode || "")) { teade(""); return; }
    if (/AADSTS50105/.test(String(err && (err.errorMessage || err.message)))) { teade("Sinu kontole ei ole selle rakenduse kasutamise luba antud. Õpilane lisatakse kursuse töörühma ja haldur annab loa; pöördu oma õpetaja poole.", true); return; }
    teade("Sisselogimine ebaõnnestus: " + ((err && (err.errorMessage || err.message)) || ""), true);
  }
  nupp.addEventListener("click", async function () {
    teade("");
    try {
      if (!ALUS) { teade("Sellelt aadressilt ei saa sisse logida. Leht asub aadressil " + ALUSED[0] + ".", true); return; }
      await msalValmis();
      var res = await app.loginPopup({ scopes: SCOPES_SISSE, prompt: "select_account", redirectUri: AUTH });
      app.setActiveAccount(res.account); konto = res.account;
      await vaaturisse();
    } catch (err) { viga(err); }
  });
  // Käivitus: kehtiva sessiooniga laaditakse leht kohe. Kui sessioon on aegunud, aga Microsofti sisselogimine on samas
  // vahekaardis alles, küsitakse uus sessioon ilma aknata. Muul juhul jääb ette uks.
  (async function () {
    if (!ALUS) { uksEtte(); return; }
    try {
      if (await ava()) return;
      await msalValmis();
      var acc = app.getAllAccounts()[0];
      if (acc) { app.setActiveAccount(acc); konto = acc; await vaaturisse(); } else uksEtte();
    } catch (err) { viga(err); }
  })();
})();
</script>
