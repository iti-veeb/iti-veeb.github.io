<script>(function () {

  function teade(t, viga) { teadeEl.textContent = t || ""; teadeEl.hidden = !t; teadeEl.classList.toggle("viga", !!viga); }

  async function vaaturiAadress() {

  }
  async function ava() {

    app = new msal.PublicClientApplication({ auth: { clientId: CLIENT, authority: "https://login.microsoftonline.com/" + TENANT, redirectUri: AUTH || ALUSED[0] + "auth.html" }, cache: { cacheLocation: (function () { try { return localStorage.getItem("iti_jaa") === "1"; } catch (e) { return false; } })() ? "localStorage" : "sessionStorage" } });

  async function toend() {

      await vaaturisse();

  });
  (async function () {

    try {
